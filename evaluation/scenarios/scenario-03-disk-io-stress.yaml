# Scenario 3 — Resource — Disk I/O stress
#
# Target: paymentservice, per Table I of "Final Disseration for ICTAC.md"
# ("Disk read/write pressure on payment database"). Recovery playbook per
# the paper: evict affected pods to alternative nodes with low disk load.
#
# IMPORTANT substitution: Online Boutique's paymentservice has no backing
# database — it's a stateless gRPC service that validates a fake credit card
# and returns a transaction ID, with no disk-backed storage at all. There is
# no literal "payment database" to stress. This injects disk I/O stress on
# the paymentservice container itself as the closest available proxy for
# the paper's scenario, via StressChaos's io stressor (stress-ng --iomix)
# rather than IOChaos, since IOChaos requires a fault-injection sidecar on a
# mounted volume and paymentservice has no PVC to target. Document this
# substitution in docs/experiment-log.md; if the thesis requires a literal
# database, paymentservice must first be re-architected onto a real
# datastore.
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: scenario-03-disk-io-stress
  namespace: chaos-mesh
spec:
  mode: all
  selector:
    namespaces:
      - boutique
    labelSelectors:
      app: paymentservice
  stressors:
    io:
      workers: 4
      bytes: "256MB"
  duration: "5m"
