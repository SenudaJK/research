# Scenario 7 — Pod/State — Random pod kill
#
# Kills the paymentservice pod outright (SIGKILL equivalent via pod deletion).
# One-shot fault: Chaos Mesh restarts the selection each `duration`, so this is
# left short and unpaused rather than continuous, matching a single discrete
# kill event per trial as described in the methodology checklist.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: scenario-07-random-pod-kill
  namespace: chaos-mesh
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - boutique
    labelSelectors:
      app: paymentservice
