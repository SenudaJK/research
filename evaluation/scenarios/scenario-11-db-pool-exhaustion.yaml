# Scenario 11 — Application — DB connection pool exhaustion
#
# Target: productcatalogservice, per Table I of "Final Disseration for
# ICTAC.md" ("Connection pool exhaustion on product catalog DB"). Recovery
# playbook per the paper: dynamically upscale database pool limit via
# ConfigMap reload.
#
# IMPORTANT substitution: Online Boutique's productcatalogservice has no
# backing database at all — it serves products.json from local memory, so
# there is no real connection pool to exhaust, and no ConfigMap-driven pool
# limit for the operator to reload. This scenario throttles inbound bandwidth
# on productcatalogservice itself, forcing its callers (frontend,
# recommendationservice) to experience the same symptom a real exhausted
# connection pool would produce — request queuing and timeouts — without a
# literal database in the loop. Document this substitution in
# docs/experiment-log.md; if the thesis requires an actual DB-backed pool,
# productcatalogservice must first be re-architected onto a real datastore.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: scenario-11-db-pool-exhaustion
  namespace: chaos-mesh
spec:
  action: bandwidth
  mode: all
  selector:
    namespaces:
      - boutique
    labelSelectors:
      app: productcatalogservice
  bandwidth:
    rate: "10kbps"
    limit: 100
    buffer: 1000
  direction: to
  duration: "5m"
