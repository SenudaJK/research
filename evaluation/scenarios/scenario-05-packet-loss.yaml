# Scenario 5 — Network — 10% packet loss
#
# Target: shippingservice, per Table I of "Final Disseration for ICTAC.md"
# ("10% packet loss on shipping service API"). Recovery playbook per the
# paper: auto-scale replicas to absorb latency; trigger path verification.
#
# docs/methodology-checklist.md currently describes this scenario as a
# "10-20% packet loss" band — the paper's Table I is the fixed reference
# point (see conversation decision to align to it), so this uses the exact
# 10% the paper specifies. Update the checklist wording to match.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: scenario-05-packet-loss
  namespace: chaos-mesh
spec:
  action: loss
  mode: all
  selector:
    namespaces:
      - boutique
    labelSelectors:
      app: shippingservice
  loss:
    loss: "10"
    correlation: "25"
  direction: to
  duration: "5m"
