# Model hyperparameters for Phase 2 (Analyze) anomaly detection.
# Centralized here for the same reason infra/versions.env centralizes infra
# pins: nothing load-bearing should be hardcoded inside a script.
#
# threshold_percentile is frozen per docs/measurement-protocol.md — it is set
# from the fault-free baseline's own training scores, never tuned on chaos
# run data. Changing it after Phase 4 starts invalidates already-collected
# trials; if you must change it, note the reason in docs/experiment-log.md
# and treat prior trials as a separate condition.

features:
  - cpu_util
  - mem_util
  - network_rx
  - log_error_rate
  - trace_latency_ms
  - trace_error_pct

# Isolation Forest is the detector actually deployed in decision-engine/ per
# docs/architecture.md. One-Class SVM and LOF exist only to produce the
# academic justification table for choosing Isolation Forest (RQ1/RQ2
# supporting evidence) — they are never wired into the live decision path.
isolation_forest:
  n_estimators: 100
  contamination: 0.01
  random_state: 42

one_class_svm:
  nu: 0.01
  kernel: rbf
  gamma: scale

local_outlier_factor:
  n_neighbors: 20
  contamination: 0.01
  novelty: true

# tau = the (threshold_percentile)th percentile of Isolation Forest anomaly
# scores on the training (fault-free) baseline. See "MTTD — Run B" in
# docs/measurement-protocol.md.
#
# Changed 99 -> 95 on 2026-09-07. Rationale (decided from the TRAINING
# distribution alone, not by fitting to any specific fault trial): with 6
# features and a random-feature-per-split Isolation Forest, p99 sat almost
# at the training score ceiling (0.715 out of a 0.33-0.73 range on a real
# 197-sample baseline) and failed to flag a genuine ~21-sigma single-feature
# CPU anomaly during a clean scenario-01 trial (20260907T021502Z). p95
# accepts a higher, but still deliberate, ~5% false-positive rate on
# healthy baseline data as an explicit design tradeoff favoring recall.
# This was NOT chosen by picking whatever value made that trial pass —
# it must be validated against a FRESH, independent fault trial before
# being treated as confirmed (see docs/experiment-log.md for that result).
threshold_percentile: 95

# Minimum State Vector rows required to train. Discovered 2026-08-27: a
# 30-sample baseline produced an Isolation Forest that could not separate a
# 30-sigma CPU outlier from healthy data — trees were too shallow and the
# p99 threshold too close to the training max to mean anything. Mirrors
# MIN_TRAINABLE_SAMPLES in infra/versions.env.
min_training_samples: 200
