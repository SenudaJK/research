# Loki — logs pillar (single-binary mode for local Kind/Minikube)
deploymentMode: SingleBinary

loki:
  # Chart 6.30.1 defaults to 3.5.0, which spam-logs push.go "negative structured metadata".
  image:
    tag: "3.5.1"
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi

gateway:
  enabled: true
  service:
    type: NodePort
    nodePort: 31000

# Memcached caches default on in Loki 6.x but exceed Kind worker memory.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
