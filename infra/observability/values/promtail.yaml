# Promtail — ships container logs to Loki
# Drop observability-namespace logs so Loki/Promtail/Grafana self-noise
# cannot enter the RQ1 log features (see docs/measurement-protocol.md).
config:
  clients:
    - url: http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push
  snippets:
    extraRelabelConfigs:
      - action: drop
        source_labels: [__meta_kubernetes_namespace]
        regex: observability
      - action: replace
        source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - action: replace
        source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - action: replace
        source_labels: [__meta_kubernetes_container_name]
        target_label: container

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
