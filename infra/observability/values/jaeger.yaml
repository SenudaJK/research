# Jaeger all-in-one — traces storage and query UI
provisionDataStore:
  cassandra: false
  elasticsearch: false

allInOne:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.64.0"
  # History (2026-08-27 -> 2026-09-06): pure in-memory storage with no
  # resource limit caused a NODE-WIDE kernel OOM after ~10 days. Adding a
  # 512Mi/1Gi limit + MEMORY_MAX_TRACES contained the crash to Jaeger's own
  # container (good), but restarts kept recurring every ~15-30 minutes
  # regardless of the memory limit or trace cap chosen — doubling both only
  # roughly doubled survival time, which means growth was rate-based (some
  # steady per-minute allocation, e.g. Go runtime/gRPC/span metadata
  # overhead), not capped by the "memory" backend's max-traces eviction as
  # intended. Tuning those two numbers further was treating the symptom.
  # Root fix: switched storage backend below from "memory" to "badger" (an
  # embedded LSM-tree store), which flushes to disk instead of keeping
  # everything RAM-resident, so its memory footprint is naturally bounded
  # regardless of trace volume or how long the process has been running.
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # Bounds on-disk badger retention so it doesn't grow unbounded over a
  # multi-day cluster lifetime. 1h is far more than any single sample/dry-run
  # window needs. Set via CLI arg, not storage.badger.extraEnv — the chart's
  # own badger.env helper (_helpers.tpl) has a template bug where combining
  # extraEnv with ephemeral:true renders two YAML entries onto one line
  # ("value: \"true\"- name: BADGER_SPAN_STORE_TTL"), breaking `helm
  # template`/`helm upgrade` entirely. Confirmed via `helm template` locally
  # against chart 3.4.1 on 2026-09-06 before choosing this workaround.
  args:
    - "--badger.span-store-ttl=1h"

storage:
  type: badger
  badger:
    # emptyDir-backed (no PVC) — traces are consumed near-real-time by
    # fusion-engine's queries (last ~1-2 min), so losing history on a pod
    # restart is acceptable; the point of this fix is avoiding restarts in
    # the first place, not preserving trace history across them.
    ephemeral: true

collector:
  enabled: false

query:
  enabled: false

agent:
  enabled: false
