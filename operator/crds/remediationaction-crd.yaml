# RemediationAction — the contract between the decision engine (Analyze/Plan)
# and the operator (Act). The orchestrator creates these; the operator
# watches and executes them. Every field the dissertation needs for RQ2
# explainability (trigger signals, matched rule, timestamp) lives in spec/
# status so `kubectl get remediationaction -o yaml` is a complete audit
# record on its own.
#
# Vertical slice scope: action enum has "scale" (scenario-01) and "restart"
# (scenario-07) implemented in operator/handlers.py. "evict" is still
# unimplemented. Extend both this schema and the operator together as more
# of the 12 scenarios' recovery actions are added — see docs/architecture.md
# Phase 3.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remediationactions.selfhealing.research.io
spec:
  group: selfhealing.research.io
  scope: Namespaced
  names:
    kind: RemediationAction
    plural: remediationactions
    singular: remediationaction
    shortNames:
      - ra
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Rule
          type: string
          jsonPath: .spec.ruleId
        - name: Action
          type: string
          jsonPath: .spec.action
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [targetRef, action, ruleId, anomalyScore, tau, explanation]
              properties:
                targetRef:
                  type: object
                  required: [kind, name, namespace]
                  properties:
                    kind:
                      type: string
                      enum: ["Deployment"]
                    name:
                      type: string
                    namespace:
                      type: string
                action:
                  type: string
                  description: >
                    "scale" and "restart" are implemented by
                    operator/handlers.py. "evict" is accepted by the schema
                    (for forward compatibility with later scenarios) but
                    rejected at runtime as "unsupported_action".
                  enum: ["scale", "restart", "evict"]
                scaleReplicas:
                  type: integer
                  minimum: 1
                ruleId:
                  type: string
                anomalyScore:
                  type: number
                tau:
                  type: number
                explanation:
                  type: string
                  description: Human-readable justification, per the ICTAC paper's explainability requirement.
                dryRun:
                  type: boolean
                  default: false
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "DryRun", "Succeeded", "Failed", "CooldownBlocked"]
                message:
                  type: string
                executedAt:
                  type: string
                previousReplicas:
                  type: integer
