# RemediationAction — the contract between the decision engine (Analyze/Plan)
# and the operator (Act). The orchestrator creates these; the operator
# watches and executes them. Every field the dissertation needs for RQ2
# explainability (trigger signals, matched rule, timestamp) lives in spec/
# status so `kubectl get remediationaction -o yaml` is a complete audit
# record on its own.
#
# Vertical slice scope: "scale" (scenario-01), "restart" (scenario-07),
# "evict" (scenario-03 Deployment-scoped, scenario-08 Node-scoped), and
# "reconcile" (scenario-12) are all implemented in operator/handlers.py.
# Extend both this schema and the operator together as more of the 12
# scenarios' recovery actions are added — see docs/architecture.md Phase 3.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remediationactions.selfhealing.research.io
spec:
  group: selfhealing.research.io
  scope: Namespaced
  names:
    kind: RemediationAction
    plural: remediationactions
    singular: remediationaction
    shortNames:
      - ra
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Rule
          type: string
          jsonPath: .spec.ruleId
        - name: Action
          type: string
          jsonPath: .spec.action
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [targetRef, action, ruleId, anomalyScore, tau, explanation]
              properties:
                targetRef:
                  type: object
                  required: [kind, name, namespace]
                  properties:
                    kind:
                      type: string
                      description: >
                        "Node" targets (R10-node-starvation-evict,
                        scenario-08) are resolved dynamically at match time
                        (decision-engine/orchestrator.py /
                        evaluation/analysis/run_trial.py's
                        resolve_dynamic_target()) since the affected node
                        isn't known until the trial picks one — targetRef.name
                        is still always a concrete node name by the time this
                        CR is created, never a placeholder.
                      enum: ["Deployment", "Node"]
                    name:
                      type: string
                    namespace:
                      type: string
                action:
                  type: string
                  description: >
                    "scale", "restart", "evict", and "reconcile" are all
                    implemented by operator/handlers.py.
                  enum: ["scale", "restart", "evict", "reconcile"]
                scaleReplicas:
                  type: integer
                  minimum: 1
                ruleId:
                  type: string
                anomalyScore:
                  type: number
                tau:
                  type: number
                explanation:
                  type: string
                  description: Human-readable justification, per the ICTAC paper's explainability requirement.
                dryRun:
                  type: boolean
                  default: false
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "DryRun", "Succeeded", "Failed", "CooldownBlocked"]
                message:
                  type: string
                executedAt:
                  type: string
                previousReplicas:
                  type: integer
